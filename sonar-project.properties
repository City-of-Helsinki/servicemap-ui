# Base SonarQube configuration for City of Helsinki Frontend projects
sonar.projectKey=City-of-Helsinki_servicemap-ui
sonar.organization=city-of-helsinki
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.exclusions= \
  src/assets/**/*, \
  **/__mocks__/**/*, \
  **/__snapshots__/*, \
  **/*.d.ts, \
  src/setupTests.js, \
  src/setupTests.ts

sonar.test.inclusions= \
  **/__tests__/**/*,  \
  **/*.test.js, \
  **/*.test.ts, \
  **/*.test.jsx, \
  **/*.test.tsx

# Coverage exclusions: files below are excluded from coverage calculations
# because unit-testing them provides poor ROI relative to the effort/fragility
# involved, and they are better validated by existing e2e (Playwright) tests:
#   - src/serviceWorker.js, src/entry-client.jsx, src/entry-server.jsx:
#     runtime/SSR bootstrap entry points with no unit-testable business logic.
#   - src/layouts/DefaultLayout.js, src/layouts/EmbedLayout.js: top-level page
#     shells that wire together routing, redux thunks, media queries and
#     lazily-loaded map views; meaningfully testing them requires a near-full
#     app integration setup rather than a unit test.
#   - src/views/AreaView/AreaView.js, src/views/MapView/MapView.js,
#     src/views/MapView/components/MarkerCluster/MarkerCluster.js,
#     src/views/MapView/components/Districts/ParkingAreas.js,
#     src/views/MapView/components/TransitStops/TransitStops.js:
#     tightly coupled to the Leaflet map instance/DOM context, requiring heavy
#     mocking of react-leaflet internals to render at all.
sonar.coverage.exclusions= \
  src/serviceWorker.js, \
  src/entry-client.jsx, \
  src/entry-server.jsx, \
  src/layouts/DefaultLayout.js, \
  src/layouts/EmbedLayout.js, \
  src/views/AreaView/AreaView.js, \
  src/views/MapView/MapView.js, \
  src/views/MapView/components/MarkerCluster/MarkerCluster.js, \
  src/views/MapView/components/Districts/ParkingAreas.js, \
  src/views/MapView/components/TransitStops/TransitStops.js
