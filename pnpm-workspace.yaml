# Don't allow dependencies to be used before they have been released for at least 1 week
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - nanoid@3.3.18

# Hoist all dependencies to the root of node_modules, for better compatibility with packages that expect flat node_modules
shamefullyHoist: true

overrides:
  '@typescript-eslint/typescript-estree>minimatch': '9.0.7'
  esbuild: '^0.28.1'
  '@opentelemetry/core@^2': '^2.8.0'
  'brace-expansion@^1': '^5.0.8'
  'brace-expansion@^2': '^5.0.8'
  'simple-update-notifier>semver': '^7.5.2'
  'ajv>fast-uri': '^3.1.4'
  postcss: '^8.5.18'
  body-parser: '^1.20.6'
  'qs@~6.14.0': '^6.15.2'

# Allow plugins that lag on peer ranges to load under ESLint 10.
peerDependencyRules:
  allowedVersions:
    eslint: '10'

allowBuilds:
  '@sentry/cli': true
  core-js: false
  esbuild: true
  unrs-resolver: true
